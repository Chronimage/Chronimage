# cargo-deny config — https://embarkstudios.github.io/cargo-deny/

# Only check Windows deps (we are Windows-first; this drops all Linux-only
# gtk-rs / webkit2gtk transitive deps from the graph entirely).
[graph]
targets = ["x86_64-pc-windows-msvc"]

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Only error if the workspace *directly* depends on an unmaintained crate;
# transitive unmaintained deps (tauri → wry → gtk-rs, etc.) are warnings only.
unmaintained = "workspace"
ignore = [
  # rsa Marvin Attack timing side-channel via sqlx-mysql transitive dep;
  # we use sqlite only and there is no upstream fix available.
  { id = "RUSTSEC-2023-0071", reason = "transitive via sqlx-mysql; we use sqlite only" },
]

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "CC0-1.0",
  "Zlib",
  "0BSD",
  "MPL-2.0",
  "Unlicense",
]
# Ignore license checks for private (non-published) workspace crates.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

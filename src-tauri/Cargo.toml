[package]
name = "chronimage"
version = "0.1.0-dev"
description = "Chronimage — on-device AI photo organizer"
authors = ["Jay Amirineni <jay@stackular.com>"]
license = "UNLICENSED"
publish = false
edition = "2021"
rust-version = "1.88"
default-run = "chronimage-app"

[[bin]]
name = "chronimage-app"
path = "src/main.rs"

[[bin]]
name = "chronimage-cli"
path = "src/bin/chronimage-cli.rs"

[lib]
name = "chronimage"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2.1", features = [] }

[dependencies]
# Tauri
tauri = { version = "2.2", features = ["devtools", "tray-icon"] }
tauri-plugin-dialog = "2.2"
tauri-plugin-fs = "2.2"
tauri-plugin-log = "2.2"
tauri-plugin-notification = "2.2"
tauri-plugin-os = "2.2"
tauri-plugin-shell = "2.2"
tauri-plugin-single-instance = "2.2"
tauri-plugin-store = "2.2"
tauri-plugin-updater = "2.3"

# Serialization + errors
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"

# Async + concurrency
tokio = { version = "1", features = ["full"] }
futures = "0.3"
rayon = "1.10"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-loki = { version = "0.2", default-features = false, features = ["compat-0-2-1"] }

# Storage + migrations (Phase 1 will flesh these out)
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono", "uuid"] }

# Hashing + perceptual hash
sha2 = "0.10"
hex = "0.4"
image_hasher = "2"

# EXIF
kamadak-exif = "0.5"

# Paths + misc
dirs = "5"
once_cell = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"

# AI / inference
ort = { version = "2.0.0-rc.12", features = ["load-dynamic"] }
image = "0.25"
num_cpus = "1"

# CLI
clap = { version = "4", features = ["derive", "env"] }

[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.5"
windows = { version = "0.58", features = [
  "Win32_Devices_PortableDevices",
  "Win32_Foundation",
  "Win32_Graphics_Dxgi",
  "Win32_System_Com",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tauri = { version = "2.2", features = ["test"] }
tempfile = "3"
proptest = "1"
mockall = "0.13"
serial_test = "3"
tokio-test = "0.4"
criterion = { version = "0.5", features = ["html_reports"] }

[profile.dev]
incremental = true
opt-level = 0

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Nightly channel builds use a less-aggressive profile for faster cycles
[profile.release-nightly]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = false

[package.metadata.cargo-machete]
ignored = ["tauri-build"]

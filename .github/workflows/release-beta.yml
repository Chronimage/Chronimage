name: release-beta

on:
  push:
    tags:
      - 'v*-beta.*'

permissions:
  contents: write

jobs:
  guard:
    name: Enforce tag on develop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - name: Refuse non-develop ancestors
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/develop 2>/dev/null; then
            git fetch origin develop
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/develop; then
              echo "::error::Beta tags must be pushed from commits that are ancestors of 'develop'."
              exit 1
            fi
          fi

  build:
    needs: guard
    name: Build signed beta (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    environment: beta
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with: { version: '9.15.0' }
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release-win

      - run: pnpm install --frozen-lockfile

      - name: Gauntlet (typecheck + test + clippy + cargo test)
        run: |
          pnpm typecheck
          pnpm exec biome ci .
          pnpm test
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Fetch bundled models
        shell: pwsh
        run: pwsh scripts/fetch-bundled-models.ps1

      - name: Stamp MSI-compatible version into beta config
        # Tauri's config parser wants strict 3-segment semver; its MSI
        # bundler also requires that any pre-release identifier be
        # numeric-only and ≤ 65535 (the Windows ProductVersion 4th-segment
        # limit). The only format that satisfies both is `X.Y.Z-N` where
        # N is a bare integer: semver-valid, tauri parses it, MSI maps
        # the pre-release number onto ProductVersion's 4th segment.
        # For each beta tag v0.1.0-beta.N we emit 0.1.0-N.
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(\d+)\.(\d+)\.(\d+)-beta\.(\d+)$') {
            throw "Unexpected tag format '$tag' — expected v<major>.<minor>.<patch>-beta.<n>"
          }
          $confVersion = "$($Matches[1]).$($Matches[2]).$($Matches[3])-$($Matches[4])"
          Write-Host "Derived conf version: $confVersion (MSI ProductVersion 4th segment = $($Matches[4]))"
          $confPath = 'src-tauri/tauri.beta.conf.json'
          $conf = Get-Content $confPath -Raw | ConvertFrom-Json
          $conf | Add-Member -NotePropertyName version -NotePropertyValue $confVersion -Force
          $conf | ConvertTo-Json -Depth 10 | Set-Content $confPath -Encoding utf8

      - name: Build signed beta MSI
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_PWD }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_SIGN_CERT_PFX_B64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PWD }}
        run: pnpm tauri build --config src-tauri/tauri.beta.conf.json

      - name: Bundle size check
        run: node scripts/bundle-size-check.cjs

      - name: GitHub Release (pre-release)
        uses: softprops/action-gh-release@v3
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi.sig

      - name: Publish updater manifest (beta)
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/publish-updater-manifest.cjs beta ${{ github.ref_name }}

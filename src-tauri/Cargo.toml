[package]
name = "chronimage"
version = "0.1.0-dev"
description = "Chronimage — on-device AI photo organizer"
authors = ["Jay Amirineni <jay@stackular.com>"]
license = "UNLICENSED"
publish = false
edition = "2021"
rust-version = "1.88"
default-run = "chronimage-app"

[[bin]]
name = "chronimage-app"
path = "src/main.rs"

[[bin]]
name = "chronimage-cli"
path = "src/bin/chronimage-cli.rs"

# Dev-only labeling helper for the phase_1_face_clustering fixture: scans a
# directory, runs real SCRFD + ArcFace, emits thumbnails + candidates.json for
# a static HTML page (tests/fixtures/face-clusters/label.html) to present.
[[bin]]
name = "chronimage-face-labeler"
path = "src/bin/chronimage-face-labeler.rs"

[lib]
name = "chronimage"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2.1", features = [] }

[dependencies]
# Tauri
tauri = { version = "2.2", features = ["devtools", "tray-icon"] }
tauri-plugin-dialog = "2.2"
tauri-plugin-fs = "2.2"
tauri-plugin-log = "2.2"
tauri-plugin-notification = "2.2"
tauri-plugin-os = "2.2"
tauri-plugin-shell = "2.2"
tauri-plugin-single-instance = "2.2"
tauri-plugin-store = "2.2"
tauri-plugin-updater = "2.3"

# Serialization + errors
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"

# Async + concurrency
tokio = { version = "1", features = ["full"] }
futures = "0.3"
rayon = "1.10"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Storage + migrations (Phase 1 will flesh these out)
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono", "uuid"] }

# sqlite-vec: statically-linked vec0 extension for ANN search (MIT OR Apache-2.0).
# The crate compiles sqlite-vec.c with -DSQLITE_CORE so it shares the same
# SQLite instance that sqlx/libsqlite3-sys links against — no symbol duplication.
sqlite-vec = "0.1.9"

# Explicit top-level dep to guarantee we call sqlite3_auto_extension on the
# same libsqlite3 that sqlx opens connections against. Must stay version-locked
# to whatever sqlx-sqlite pulls in (currently 0.30.1).
libsqlite3-sys = "0.30.1"

# Hashing + perceptual hash
sha2 = "0.10"
hex = "0.4"
image_hasher = "2"

# EXIF
kamadak-exif = "0.6"

# Paths + misc
dirs = "5"
once_cell = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"

# HTTP client (model downloader — user-initiated only)
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "json"] }

# Google Photos OAuth2: base64url-encoded PKCE challenges + CSRF state tokens.
base64 = "0.22"
# Cryptographic RNG for PKCE verifier + state token (OS entropy source).
getrandom = "0.2"
# Cross-platform secret store. On Windows this routes to Credential Manager; on
# macOS to Keychain; on Linux to Secret Service. OAuth refresh tokens for cloud
# source connectors are persisted here — never in the catalog DB.
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }

# Zip extraction for InsightFace buffalo_l.zip bundle (MIT licence)
zip = "2"

# AI / inference
# ort is the ONNX Runtime Rust binding.
# `download-binaries` (build.rs fetches Microsoft's prebuilt onnxruntime for the
# target platform and statically wires the import lib) replaces the previous
# `load-dynamic` (runtime DLL lookup). On Windows `load-dynamic` was finding
# the OS-bundled `C:\Windows\System32\onnxruntime.dll` — that's the Windows AI
# Foundry "germanium" build (ABI incompatible with ort's expectations) and
# `Session::commit_from_file` hung indefinitely in init. download-binaries
# pins the standard Microsoft release so Session loads deterministically.
ort = { version = "2.0.0-rc.12", features = ["download-binaries"] }
image = "0.25"
num_cpus = "1"
# HDBSCAN face clustering — MIT OR Apache-2.0
hdbscan = "0.12.0"
# SigLIP-2 tokenizer — HuggingFace tokenizer.json format (MIT OR Apache-2.0)
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# .env loader — dev convenience so CHRONIMAGE_* env vars (e.g. the Google
# Photos OAuth client_secret) can live in the gitignored .env.local.
dotenvy = "0.15"

[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.6"
windows = { version = "0.61", features = [
  "Win32_Devices_PortableDevices",
  "Win32_Foundation",
  "Win32_Graphics_Dxgi",
  "Win32_System_Com",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tauri = { version = "2.2", features = ["test"] }
tempfile = "3"
proptest = "1"
mockall = "0.14"
serial_test = "3"
tokio-test = "0.4"
criterion = { version = "0.8", features = ["html_reports"] }

[profile.dev]
incremental = true
opt-level = 0

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Nightly channel builds use a less-aggressive profile for faster cycles
[profile.release-nightly]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = false

[package.metadata.cargo-machete]
ignored = ["tauri-build"]

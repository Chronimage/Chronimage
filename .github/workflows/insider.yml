name: insider

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Insider tag (e.g. v0.3.0-insider.1)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build signed insider (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    environment: insider
    steps:
      - uses: actions/checkout@v6
      - name: Validate tag pattern
        shell: pwsh
        run: |
          if (-not ('${{ github.event.inputs.tag }}' -match '^v\d+\.\d+\.\d+-insider\.\d+$')) {
            throw "Tag must match v<semver>-insider.<N>"
          }

      - uses: pnpm/action-setup@v6
        with: { version: '9.15.0' }
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release-win

      - run: pnpm install --frozen-lockfile

      - name: Gauntlet
        run: |
          pnpm typecheck
          pnpm exec biome ci .
          pnpm test
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Fetch bundled models
        shell: pwsh
        run: pwsh scripts/fetch-bundled-models.ps1

      - name: Build signed insider MSI
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY_INSIDER }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_PWD_INSIDER }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_SIGN_CERT_PFX_B64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PWD }}
        run: pnpm tauri build --config src-tauri/tauri.insider.conf.json

      - name: Bundle size check
        run: node scripts/bundle-size-check.cjs

      - name: Tag commit
        run: |
          git tag -s "${{ github.event.inputs.tag }}" -m "Insider build"
          git push origin "${{ github.event.inputs.tag }}"

      - name: Private Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag }}
          prerelease: true
          draft: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig

      - name: Publish updater manifest (insider, license-gated)
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/publish-updater-manifest.cjs insider ${{ github.event.inputs.tag }}

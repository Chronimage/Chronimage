name: release-stable

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  guard:
    name: Enforce tag on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Refuse non-main ancestors
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Stable tags must come from commits reachable on 'main'."
            exit 1
          fi

  build:
    needs: guard
    name: Build signed stable (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    environment: stable
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '9.15.0' }
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release-win

      - run: pnpm install --frozen-lockfile

      - name: Gauntlet
        run: |
          pnpm typecheck
          pnpm exec biome ci .
          pnpm test
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build signed stable MSI
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_PWD }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_SIGN_CERT_PFX_B64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PWD }}
        run: pnpm tauri build

      - name: Bundle size check
        run: node scripts/bundle-size-check.cjs

      - name: Generate changelog
        run: pnpm exec git-cliff --tag ${{ github.ref_name }} --output CHANGELOG.md

      - name: Record bundle-size baseline
        run: node scripts/record-size-baseline.cjs ${{ github.ref_name }} > docs/release/bundle-size-baseline.json

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: CHANGELOG.md
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi.sig

      - name: Publish updater manifest (stable)
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/publish-updater-manifest.cjs stable ${{ github.ref_name }}

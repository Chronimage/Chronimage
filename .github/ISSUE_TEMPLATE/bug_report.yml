name: Bug report
description: Something broke in Chronimage
title: "[bug] "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Fill in what you can — leave the rest
        blank. If this is a **security issue**, please don't use this
        form; see [SECURITY.md](../../SECURITY.md) instead.

  - type: input
    id: version
    attributes:
      label: Chronimage version
      description: Check `Help → About` or `pnpm tauri info`.
      placeholder: e.g. 1.0.0-beta.3
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      description: Windows 11 build, macOS version, Linux distro + kernel.
      placeholder: e.g. Windows 11 Pro 23H2
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug. Screenshots help.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Ideally a minimal sequence that triggers the bug reliably.
      placeholder: |
        1. Open …
        2. Click …
        3. Observe …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Paste the last few lines from `%LOCALAPPDATA%/app.chronimage.desktop/logs/chronimage.log`
        (Windows) or the equivalent on your OS. Scrub anything personal.
      render: shell

  - type: checkboxes
    id: confirm
    attributes:
      label: Before submitting
      options:
        - label: I've searched [existing issues](https://github.com/Chronimage/chronimage/issues?q=is%3Aissue) for this bug.
          required: true
        - label: I'm on the latest release of the channel I track (stable / beta / nightly).
          required: true

name: release-beta

on:
  push:
    tags:
      - 'v*-beta.*'

permissions:
  contents: write

jobs:
  guard:
    name: Enforce tag on develop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - name: Refuse non-develop ancestors
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/develop 2>/dev/null; then
            git fetch origin develop
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/develop; then
              echo "::error::Beta tags must be pushed from commits that are ancestors of 'develop'."
              exit 1
            fi
          fi

  build:
    needs: guard
    name: Build signed beta (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    environment: beta
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with: { version: '9.15.0' }
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release-win

      - run: pnpm install --frozen-lockfile

      - name: Gauntlet (typecheck + test + clippy + cargo test)
        run: |
          pnpm typecheck
          pnpm exec biome ci .
          pnpm test
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Fetch bundled models
        shell: pwsh
        run: pwsh scripts/fetch-bundled-models.ps1

      - name: Stamp MSI-compatible version into beta config
        # MSI ProductVersion must be X.Y.Z[.N] with numeric-only segments,
        # each ≤ 65535. Our base tauri.conf.json ships 0.1.0 (no suffix);
        # for each beta tag v0.1.0-beta.N we derive the MSI form
        # 0.1.0.N and patch it into tauri.beta.conf.json so wix accepts
        # the build. Preserves the tag's semver identity in the
        # auto-updater manifest (which ships separately) while keeping
        # the installer's ProductVersion legal.
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(\d+)\.(\d+)\.(\d+)-beta\.(\d+)$') {
            throw "Unexpected tag format '$tag' — expected v<major>.<minor>.<patch>-beta.<n>"
          }
          $msiVersion = "$($Matches[1]).$($Matches[2]).$($Matches[3]).$($Matches[4])"
          Write-Host "Derived MSI version: $msiVersion"
          $confPath = 'src-tauri/tauri.beta.conf.json'
          $conf = Get-Content $confPath -Raw | ConvertFrom-Json
          $conf | Add-Member -NotePropertyName version -NotePropertyValue $msiVersion -Force
          $conf | ConvertTo-Json -Depth 10 | Set-Content $confPath -Encoding utf8

      - name: Build signed beta MSI
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_PWD }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_SIGN_CERT_PFX_B64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PWD }}
        run: pnpm tauri build --config src-tauri/tauri.beta.conf.json

      - name: Bundle size check
        run: node scripts/bundle-size-check.cjs

      - name: GitHub Release (pre-release)
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi.sig

      - name: Publish updater manifest (beta)
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/publish-updater-manifest.cjs beta ${{ github.ref_name }}

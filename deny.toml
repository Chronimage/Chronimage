# cargo-deny config — https://embarkstudios.github.io/cargo-deny/

# Only check Windows deps (we are Windows-first; this drops all Linux-only
# gtk-rs / webkit2gtk transitive deps from the graph entirely).
[graph]
targets = ["x86_64-pc-windows-msvc"]

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Only error if the workspace *directly* depends on an unmaintained crate;
# transitive unmaintained deps (tauri → wry → gtk-rs, etc.) are warnings only.
unmaintained = "workspace"
ignore = []

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "CC0-1.0",
  "Zlib",
  "0BSD",
  "MPL-2.0",
  "Unlicense",
  # webpki-roots / webpki-root-certs ship Mozilla's CA bundle under this
  # permissive data license. Transitive via reqwest/rustls.
  "CDLA-Permissive-2.0",
  # mozjpeg + mozjpeg-sys (optional `mozjpeg` cargo feature — see
  # src-tauri/Cargo.toml). IJG is the Independent JPEG Group license —
  # the same permissive license every libjpeg-derived library ships
  # under; equivalent to modified-BSD in effect. Pulled into the graph
  # only when the `mozjpeg` feature is enabled at build time.
  "IJG",
]
# Ignore license checks for private (non-published) workspace crates.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
